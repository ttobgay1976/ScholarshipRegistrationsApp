
spring.application.name=student-Registration

# Profile
spring.profiles.active=dev

#context path
server.servlet.context-path=/

# Server
server.port=8081
#server.servlet.context-path=/FLDMGT/


# Logging
logging.file.name=logs/SPRMS_REGIS.log
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=30

# Maximum file size
spring.servlet.multipart.max-file-size=50MB

# Maximum request size (sum of all files)
spring.servlet.multipart.max-request-size=50MB





