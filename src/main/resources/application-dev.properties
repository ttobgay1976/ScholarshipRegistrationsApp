# =====================================================
# DATABASE CONFIGURATION
# =====================================================

spring.config.import=optional:file:.env[.properties]

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# =====================================================
# HIKARI CONNECTION POOL

# =====================================================

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.auto-commit=true

# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# =====================================================
# APPLICATION LOGGING
# =====================================================

logging.level.org.springframework.web.servlet.resource=ERROR

# =====================================================
# PACKAGE SCAN
# =====================================================

packagesToScan=com.sprms.registration

# =====================================================
# NDI CONFIGURATION
# =====================================================

ndi.auth.base.url=${NDI_AUTH_BASE_URL}
ndi.base.url=${NDI_PROOF_REQUEST_BASE_URL}
ndi.client.id=${NDI_CLIENT_KEY}
ndi.client.secret=${NDI_SECRET_KEY}

#USE FOR AOTHER PURPOSE
app.ndiAuthBaseURL=${NDI_AUTH_BASE_URL}
app.ndiProofRequestBaseURL=${NDI_PROOF_REQUEST_BASE_URL}
app.ndiClientId=${NDI_CLIENT_KEY}
app.ndiClientSecretId=${NDI_SECRET_KEY}
app.ndiWebhookToken=${NDI_WEBHOOK_TOKEN}

# =====================================================
# NDI SCHEMAS
# =====================================================

app.foundationSchema=${NDI_FOUNDATION_SCHEMA}
app.locationSchema=${NDI_LOCATION_SCHEMA}

# =====================================================
# NDI WEBHOOK SERVICES
# =====================================================

app.webhookRegistrationUrl=${NDI_WEBHOOK_REGISTRATION_URL}
app.subcribeWebhookServices=${NDI_SUBCRIBE_WEBHOOK_SERVICES}
app.unSubcribeWebhookServices=${NDI_UNSUBCRIBE_WEBHOOK_SERVICES}

ndi.webhook.id=${NDI_WEBHOOK_ID}
ndi.webhook.url=${NDI_WEBHOOK_URL}

# =====================================================
# BCSEA API
# =====================================================

app.bcseaApiUrl=${BCSEA_BASE_API_URL}
app.bcseaTokenUrl=${BCSEA_TOKEN_URL}
app.bcseaClientKey=${BCSEA_CLIENT_KEY}
app.bcseaSecretKey=${BCSEA_SECRET_KEY}

# =====================================================
# DCRC API
# =====================================================

app.dcrcBaseApiUrl=${DCRC_BASE_API_URL}
app.dcrcTokenUrl=${DCRC_TOKEN_URL}
app.dcrcClientKey=${DCRC_CLIENT_KEY}
app.dcrcSecretKey=${DCRC_SECRET_KEY}

#FILE PATH
file.upload-dir=${UPLOAD_DIR}

#EMAIL SETTING
app.mail.from=${SMTP_FROM}
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8

# =====================================================
# RESILIENCE4J RETRY CONFIGURATION
# =====================================================
resilience4j.retry.instances.bcseaApi.max-attempts=3
resilience4j.retry.instances.bcseaApi.wait-duration=2s
resilience4j.retry.instances.bcseaApi.retry-exceptions=java.net.SocketTimeoutException,org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException
