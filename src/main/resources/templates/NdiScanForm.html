<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>|| NDI Login</title>
<link rel="icon" type="image/png" sizes="32x32"
	th:href="@{/images/RCSC-logo.png}" />

<th:block
	th:replace="~{fragments/commonresource_css :: common_resource_css}"></th:block>
<script th:inline="javascript">
	document
			.addEventListener(
					"DOMContentLoaded",
					function() {

						// ================= QR CODE =================
						const qrUrlString = /*[[${qrUrl}]]*/"";

						if (qrUrlString) {
							new QRCode(document.getElementById("qrcode"), {
								text : qrUrlString,
								width : 500,
								height : 500,
								colorDark : "#000000",
								colorLight : "#ffffff",
								correctLevel : QRCode.CorrectLevel.H
							});
						}

						// ================= THREAD ID =================
						const threadInput = document.getElementById("threadId");

						if (!threadInput) {
							console.error("threadId not found");
							return;
						}

						const thid = threadInput.value;

						// ================= SSE CONNECTION =================
						const eventSource = new EventSource(
								window.location.origin + "/ndi/events/" + thid);

						eventSource.onopen = function() {
							console.log("✅ SSE CONNECTED");
						};

						eventSource.onmessage = function(event) {
							console.log("Message:", event.data);
						};

						eventSource.addEventListener("heartbeat", function(
								event) {
							console.log("Heartbeat:", event.data);
							console.log("Heartbeat my heart");
						});

						eventSource
								.addEventListener(
										"status",
										function(event) {

											console
													.log(
															"🔥 STATUS EVENT RECEIVED:",
															event);
											console.log("@@RAW DATA:",
													event.data);

											try {
												console.log("Parsing data:",
														event.data);

												const data = JSON
														.parse(event.data);

												console.log("Parsed object:",
														data);

												if (data.status === "PROOF_VALIDATED") {
													console
															.log("✅ Proof validated");
													eventSource.close();

													console
															.log(
																	"Redirecting with thid:",
																	thid);

													window.location.href = "/ndi/post-login?thid="
															+ thid;
												}

											} catch (e) {
												console.error(
														"❌ JSON parse failed:",
														e);
												console.error(
														"Raw event data:",
														event.data);
											}
										});

						eventSource.onerror = function() {
							console
									.log("⚠️ SSE connection lost (browser will auto-reconnect)");
						};

					});
</script>

<style type="text/css">

/* =========================================================
   NDI COLORS
========================================================= */
:root { 
	--ndi-green: #5AC994; 
	--ndi-text: #999999; 
	--ndi-dark: #222222; 
	--ndi-border: #cccccc;
}
/* =========================================================
   PAGE
========================================================= */
.container {
	width: 100%;
}

.page-wrapper {
	display: flex;
	justify-content: center;
	align-items: flex-start;
	padding: 5px;
	background-color: #f7f7f7;
}

/* =========================================================
   MAIN CARD
========================================================= */
.login-box {
	width: 590px;
	min-height: 750px;
	box-sizing: border-box;
	padding: 18px 35px 30px;
	background-color: #F8F8F8;
	border: 1px solid var(--ndi-border);
	border-radius: 6px;
	text-align: center;
}

/* =========================================================
   TITLE
========================================================= */
.title {
	margin: 30px 0 30px;
	color: var(--ndi-dark);
	font-size: 18px;
	font-weight: 600;
	text-align: center;
}

.title span {
	color: var(--ndi-green);
}

/* =========================================================
   RESPONSIVE QR CODE
========================================================= */
.qr-wrapper {
	position: relative;
	display: flex;
	justify-content: center;
	align-items: center;
	width: 100%;
	margin: 0 auto 32px;
}

.qr-box {
	position: relative;
	display: flex;
	justify-content: center;
	align-items: center;
	/* responsive QR container */
	width: min(280px, 75vw);
	aspect-ratio: 1/1;
	padding: 12px;
	background-color: #ffffff;
	border: 3px solid var(--ndi-green) !important;
	box-sizing: border-box;
	border-radius: 11px;
}

#qrcode {
	display: block;
	/* fill available qr-box space */
	width: 100% !important;
	height: 100% !important;
	margin: 0 !important;
	padding: 0 !important;
	background-color: #ffffff;
	border: none !important;
	outline: none !important;
	line-height: 0;
}

#qrcode img, #qrcode canvas {
	display: block;
	width: 100% !important;
	height: 100% !important;
	margin: 0 !important;
	padding: 0 !important;
	background-color: #ffffff;
	border: none !important;
	outline: none !important;
	box-shadow: none !important;
	border-radius: 0 !important;
}

/* QR center NDI logo */
.qr-logo {
	position: absolute;
	top: 50%;
	left: 50%;
	width: clamp(55px, 22%, 80px) !important;
	height: auto !important;
	transform: translate(-50%, -50%);
	object-fit: contain;
	border: none !important;
	outline: none !important;
	box-shadow: none !important;
	z-index: 5;
}

/* =========================================================
   LOADER
========================================================= */
.loader {
	display: none;
	position: absolute;
	top: 50%;
	left: 50%;
	transform: translate(-50%, -50%);
	z-index: 20;
}

/* =========================================================
   INSTRUCTIONS
========================================================= */
.steps {
	width: fit-content;
	max-width: 450px;
	margin: 0 auto 44px;
	color: var(--ndi-text);
	font-size: 14px;
	line-height: 1.6;
	text-align: left;
}

.steps p {
	margin: 0 0 0 100px;
	padding: 0;
}

.step-two {
	display: flex;
	align-items: flex-start;
}

.step-no {
	flex: 0 0 auto;
	margin-right: 5px;
}

.step-text {
	display: block;
}

/* =========================================================
   SCAN ICON
========================================================= */
.scan-icon {
	display: inline-flex !important;
	width: 20px;
	height: 20px;
	margin: 0 4px;
	align-items: center;
	justify-content: center;
	vertical-align: middle;
	background: #42cc87 !important;
	background-color: #42cc87 !important;
	border-radius: 50%;
	opacity: 1 !important;
	visibility: visible !important;
}

/* Bootstrap QR icon */
.scan-icon i {
	display: inline-block !important;
	color: #ffffff !important;
	font-size: 11px !important;
	line-height: 1 !important;
	opacity: 1 !important;
	visibility: visible !important;
}
/* =========================================================
   VIDEO BUTTON
========================================================= */
.video-btn {
	width: 210px;
	height: 42px;
	box-sizing: border-box;
	/* margin: 0 auto 32px; */
	margin: 30px auto 30px;
	display: flex;
	justify-content: center;
	align-items: center;
	gap: 12px;
	background-color: #ffffff;
	border: 2px solid var(--ndi-green);
	border-radius: 24px;
	color: var(- -ndi-green) !important;
	font-size: 15px;
	font-weight: 400;
	text-decoration: none !important;
	transition: background-color 0.2s ease, color 0.2s ease;
}

/* =========================
   HOVER
========================= */

.video-btn:hover {
    background-color: var(--ndi-green) !important;
    border-color: var(--ndi-green) !important;
    color: #ffffff !important;
}

/* Button text becomes white */
.video-btn:hover span {
    color: #ffffff !important;
}

/* Circle becomes WHITE */
.video-btn:hover .play-icon {
    background-color: #ffffff !important;
}

/* Play icon becomes BLUE */
.video-btn:hover .play-icon i {
   color: var(--ndi-green) !important;
}

/* PLAY CIRCLE */
.play-icon {
	display: inline-flex !important;
	width: 20px;
	height: 20px;
	align-items: center;
	justify-content: center;
	background-color: #42cc87 !important;
	border-radius: 50%;
	padding: 0 !important;
	box-sizing: border-box;
}

.play-icon i {
	display: flex !important;
	width: 100%;
	height: 100%;
	align-items: center;
	justify-content: center;
	color: #ffffff !important;
	font-size: 14px !important;
	line-height: 1 !important;
	margin: 0 !important;
	padding: 0 !important;
	/* visually center the triangle */
	transform: translateX(1px);
	opacity: 1 !important;
	visibility: visible !important;
}

/* =========================================================
   DOWNLOAD SECTION
========================================================= */
.download-section {
	margin: 0 auto 3px;
	text-align: center;
}

.download-text {
	margin: 0 0 4px;
	color: var(--ndi-text);
	font-size: 13px;
	font-weight: 400;
	display: flex;
	justify-content: center;
	align-items: baseline;
	gap: 4px;
	flex-wrap: nowrap;
}

.download-link {
	color: var(--ndi-green) !important;
	font-size: 15px;
	font-weight: 600;
	text-decoration: none !important;
	white-space: nowrap;
}

.download-link:hover {
	text-decoration: underline !important;
}

/* =========================================================
   STORE LINKS
========================================================= */
.store-links {
	display: flex;
	justify-content: center;
	align-items: center;
	gap: 14px;
	margin: 10px auto 30px;
}

.store-links a {
	display: inline-block;
	line-height: 0;
	text-decoration: none;
}

.store-links img {
	display: block;
	width: auto;
	height: 37px;
	margin: 0;
	border: none;
}

/* =========================================================
   SUPPORT
========================================================= */
.support {
	text-align: center;
	margin: 30xp 0 0;
}

.support-title {
	display: inline-block;
	/* margin-bottom: 18px; */
	color: var(--ndi-green) !important;
	font-size: 14px;
	font-weight: 600;
	text-decoration: none !important;
}

.support-title:hover {
	text-decoration: underline !important;
}

/* SUPPORT DETAILS */
.support-details {
	display: flex;
	justify-content: center;
	align-items: center;
	gap: 12px;
	font-size: 13px;
	margin: 10px 0 30px;
	font-weight: 700; /* semi-bold */
}

.support-details a {
	display: inline-flex;
	align-items: center;
	color: var(--ndi-dark) !important;
	font-weight: 700;
	text-decoration: none !important;
}

/* Green email / phone icons */
.support-details i {
	display: inline-block !important;
	margin-right: 5px;
	color: #42cc87 !important;
	font-size: 14px !important;
	/* opacity: 1 !important; */
	visibility: visible !important;
}

/* =========================================================
   DEEP LINK
========================================================= */
/* Hidden by default */
.deep-link-section {
	display: none !important;
}

.deep-link-divider {
	display: flex;
	align-items: center;
	width: 100%;
	margin: 20px 0;
	color: #777;
	font-size: 13px;
}

.deep-link-divider::before, .deep-link-divider::after {
	content: "";
	flex: 1;
	height: 1px;
	background-color: #ddd;
}

.deep-link-divider span {
	padding: 0 12px;
}

.deep-link-btn {
	display: flex;
	align-items: center;
	justify-content: center;
	width: 100%;
	min-height: 48px;
	padding: 10px 18px;
	box-sizing: border-box;
	background-color: var(--ndi-green);
	color: #ffffff !important;
	font-size: 15px;
	font-weight: 600;
	text-align: center;
	text-decoration: none !important;
	border: none;
	border-radius: 6px; /* APPLY HERE */
}

.deep-link-btn:hover {
	opacity: 0.9;
	color: #ffffff !important;
}

/* =========================================================
   MOBILE
========================================================= */
@media screen and (max-width: 500px) {
	.container {
		width: 100% !important;
		max-width: 100% !important;
		padding: 0 !important;
		margin: 0 !important;
	}
	.page-wrapper {
		width: 100%;
		display: flex;
		justify-content: center;
		padding: 0;
	}
	.login-box {
		width: 90%;
		margin-top: 20px;
		min-height: 100vh;
		padding: 15px 20px 30px;
		box-sizing: border-box;
		border-left: none;
		border-right: none;
		/* border-radius: 0; */
		border: 1px solid var(--ndi-border);
		border-radius: 6px;
	}

	/* CENTER QR AREA */
	.qr-wrapper {
		width: 100%;
		display: flex;
		justify-content: center;
		align-items: center;
	}
	.qr-box {
		width: min(240px, 82vw);
		aspect-ratio: 1/1;
		margin: 0 auto !important;
		padding: 10px;
		box-sizing: border-box;
	}
	#qrcode {
		width: 100% !important;
		height: 100% !important;
	}
	#qrcode img, #qrcode canvas {
		width: 100% !important;
		height: 100% !important;
	}
	.deep-link-section {
		display: block !important;
		width: 100%;
		max-width: 320px;
		margin: 0 auto 25px;
	}
	.steps p {
		margin: 0 0 0 30px;
		padding: 0;
	}
	.download-text {
		display: block;
		text-align: center;
	}
	.download-link {
		display: block;
		margin-top: 3px;
	}
}
</style>
</head>
<body>

	<div th:replace="~{fragments/header :: header}"></div>

	<!-- =====================================================
     NDI UI
====================================================== -->

	<div class="container mt-5">

		<div class="page-wrapper">

			<div class="login-box">


				<!-- ==========================================
			     TITLE
			=========================================== -->

				<h2 class="title">
					Scan with <span>Bhutan NDI</span> Wallet
				</h2>

				<div class="deep-link-section">

					<a th:href="${deepLink}" class="deep-link-btn"> Open Bhutan NDI
						Wallet </a>

					<div class="deep-link-divider">
						<span>OR</span>
					</div>


				</div>

				<!-- ==========================================
			     QR CODE
			=========================================== -->

				<div class="qr-wrapper">

					<!-- Loader -->
					<div id="loader" class="loader"></div>


					<div class="qr-box">

						<!-- Generated QR -->
						<div id="qrcode"></div>


						<!-- NDI Logo -->
						<img th:src="@{/images/QRNDIlogo.png}" class="qr-logo"
							style="width: 60px; height: 60px;" alt="NDI Logo">

					</div>

				</div>


				<!-- ==========================================
			     SCAN INSTRUCTIONS
			=========================================== -->

				<div class="steps">

					<p>1. Open Bhutan NDI Wallet on your phone</p>

					<p class="step-two">
						<span class="step-no">2.</span> <span class="step-text">
							Tap the Scan button <span class="scan-icon"> <i
								class="bi bi-qr-code-scan"></i>
						</span> located on the menu bar and scan QR code
						</span>
					</p>

				</div>


				<!-- ==========================================
			     VIDEO GUIDE
			=========================================== -->
				<a href="https://www.youtube.com/@BhutanNDI" target="_blank"
					rel="noopener noreferrer" class="video-btn"> <span>
						Watch video guide </span> <span class="play-icon"> <i
						class="bi bi-play-fill"></i>
				</span>

				</a>


				<!-- ==========================================
			     DOWNLOAD
			=========================================== -->

				<div class="download-section">

					<p class="download-text">
						Don't have the Bhutan NDI Wallet? <a
							href="https://www.bhutanndi.com/" target="_blank"
							rel="noopener noreferrer" class="download-link"> Download
							Now! </a>
					</p>
				</div>

				<!-- ==========================================
			     APP STORES
				=========================================== -->

				<div class="store-links">


					<!-- GOOGLE PLAY -->

					<a href="https://play.google.com/" target="_blank"
						rel="noopener noreferrer"> <img
						th:src="@{/images/PlayStore.png}" alt="Get it on Google Play">

					</a>


					<!-- APP STORE -->

					<a href="https://apps.apple.com/" target="_blank"
						rel="noopener noreferrer"> <img
						th:src="@{/images/AppStore.png}" alt="Download on App Store">

					</a>


				</div>


				<!-- ==========================================
			     SUPPORT
			=========================================== -->

				<div class="support">

					<a href="https://www.bhutanndi.com/" target="_blank"
						rel="noopener noreferrer" class="support-title"> Get Support </a>


					<div class="support-details">


						<!-- EMAIL -->

						<a href="mailto:ndifeedback@bhutanndi.bt"> <img
							th:src="@{/images/Mail.svg}" style="width: 18px; height: 18px;"
							alt="mail"> &nbsp; ndifeedback@bhutanndi.bt

						</a>


						<!-- PHONE -->

						<a href="tel:1199"> <img th:src="@{/images/Call.svg}"
							style="width: 18px; height: 18px;" alt="call"> 1199

						</a>


					</div>

				</div>


				<!-- ==========================================
			     EXISTING THREAD ID
			=========================================== -->

				<input type="hidden" id="threadId" th:value="${threadId}">


			</div>

		</div>

	</div>

	<!-- JS Fragment -->
	<th:block
		th:replace="~{fragments/commonresource_js :: common_resource_js}"></th:block>

</body>
</html>
