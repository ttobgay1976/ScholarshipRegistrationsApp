<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* ===============================
   DESKTOP
================================ */
/* Entire header content */
.sprms-header-content {
	width: 100%;
	display: flex;
	align-items: center;
	justify-content: center;
}

/* Logo + title group */
.sprms-header-brand {
	display: flex;
	align-items: center;
	justify-content: center;
}

.sprms-logo {
    height: 40px !important;
    width: auto !important;
    max-width: none !important;
    margin-right: 10px;
    object-fit: contain;
}
.sprms-title {
    color: #ffffff;
    font-size: 20px;
    font-weight: 600;
}

.desktop-title {
    display: inline !important;
}

.mobile-title {
    display: none !important;
}

.sprms-header-brand .desktop-title {
	display: inline !important;
}

.sprms-header-brand .mobile-title {
	display: none !important;
}

/* =========================================
   MOBILE
========================================= */
@media screen and (max-width: 500px) {
	.sprms-header-brand .desktop-title {
		display: none !important;
	}
	.sprms-header-brand .mobile-title {
		display: inline-block !important;
		color: #ffffff !important;
		font-size: 17px;
		font-weight: 600;
		white-space: nowrap;
	}
	.sprms-header-content {
		padding-left: 10px !important;
		padding-right: 10px !important;
	}
	.sprms-header-brand {
		display: flex;
		align-items: center;
		justify-content: center;
		width: 100%;
	}
	.sprms-logo {
		height: 38px;
		width: auto;
		margin-right: 10px;
	}
}
</style>
</head>

<header th:fragment="header" class="bg-success text-white py-2">

	<div class="container-fluid p-0">

		<div class="sprms-header-content">

			<div class="sprms-header-brand">

				<img th:src="@{/images/RCSC-logo.png}" style="height: 50px; margin-right: 15px;" alt="RCSC Logo">

				<!-- Desktop -->
				<span class="sprms-title desktop-title"> Scholarship Profile
					and Resource Management System (SPRMS) - RCSC </span>

				<!-- Mobile -->
				<span class="sprms-title mobile-title"> SPRMS - RCSC </span>

			</div>

		</div>

	</div>

</header>
</html>
